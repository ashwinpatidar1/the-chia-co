<!DOCTYPE html>
<html lang="en">
<head>

  <title>My Orders</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

      <div class="account-navigation">

      </div>

      <div class="orders-card">

        <p id="ordersMessage"></p>

              <th>Total Amount</th>
              <th>Order Status</th>

              <th>Order Date</th>

          <tbody id="ordersTableBody"></tbody>
        </table>

    </div>
  </main>

  <script src="js/orders.js"></script>

</html>
